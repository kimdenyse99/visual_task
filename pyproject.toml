[project]
name = "visual_tasks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mxbiflow[log]",
    "numpy>=2.5.2",
    "Pillow>=11.0.0",
    "pymotego>=0.1.6",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
mxbiflow = { git = "https://github.com/PJendritza/mxbiflow.git", branch = "feature/mx-eye-events" }

[tool.pyright]
include = ["analysis", "main.py", "models.py", "stages", "tests"]
typeCheckingMode = "strict"
reportPrivateUsage = "error"
reportMissingTypeStubs = "none"

[dependency-groups]
dev = ["pyright>=1.1.411", "ruff>=0.16.5"]
